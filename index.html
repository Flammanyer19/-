<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-title" content="日本語のリト"><meta name="theme-color" content="#17283f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>日本語のリト</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1a2c;color:#edf4ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px 16px 45px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.65rem;margin:5px 0 16px}.pill{background:#30415e;border-radius:30px;padding:9px 12px;color:#f6d483}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button,select{font:inherit;border-radius:12px;padding:12px;background:#263955;color:white;border:1px solid #4c6384;cursor:pointer}button.active,.primary{background:#276e9c;border-color:#5fb1e8}button:disabled{opacity:.5}section{background:#182a42;border:1px solid #2b4262;border-radius:17px;padding:17px;margin-top:14px}label{display:block;margin:10px 0 5px;color:#b6cbe3}select{width:100%}.card{background:#253a55;border:1px solid #527299;border-radius:15px;min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;margin:16px 0;white-space:pre-line}.jp{font-size:2.1rem;font-weight:650}.hint{color:#a9c4dc;font-size:.88rem;margin-top:12px}.actions{display:flex;gap:8px}.actions button{flex:1}.opt{width:100%;display:block;text-align:left;margin:8px 0}.correct{border-color:#53d7a6;background:#145343}.wrong{border-color:#ff7777;background:#6d303c}#feedback{line-height:1.6;color:#f3d89a;white-space:pre-line;margin:10px 0}.muted{color:#aac1d9;font-size:.88rem}input[type=file]{max-width:100%;margin:8px 0}small{color:#afc4df}h2{font-size:1.15rem}#message{color:#f4d68b}</style></head><body><main><header><div><small>日本語のリト · JLPT N5–N4</small><h1>⛩️ 日本語のリト</h1></div><span class="pill" id="xp">0 XP</span></header><nav><button class="active" data-mode="vocab">📚 Vocabulario</button><button data-mode="verbs">✍️ Verbos</button><button data-mode="kanji">🈷️ Kanji</button></nav><section><label for="topic">Campo semántico</label><select id="topic"></select><label for="activity">Actividad</label><select id="activity"><option value="cards">Tarjetas</option><option value="quiz">Quiz (4 opciones)</option></select><label for="submode">Qué practicar</label><select id="submode"></select><div class="muted" id="count" style="margin-top:12px"></div><div class="card" id="card" role="button" tabindex="0"><div class="jp" id="prompt">Cargando…</div><div class="hint" id="subtext"></div></div><div id="options"></div><div id="feedback"></div><div class="actions" id="cardactions"><button id="flip">Mostrar respuesta</button><button id="again">Repasar</button><button class="primary" id="good">Ya la sé</button></div><div class="actions" id="quizactions" hidden><button class="primary" id="next">Siguiente →</button></div></section><section><h2>📊 Mi progreso</h2><p id="stats" class="muted"></p><button id="export">Exportar progreso JSON</button><label for="import">Importar progreso JSON</label><input id="import" type="file" accept=".json,application/json"><p id="message" class="muted"></p></section><p class="muted">Para estudiar offline en iPhone: publica la carpeta en HTTPS, ábrela con Safari y usa Compartir → Añadir a pantalla de inicio. Abre la aplicación una vez con conexión antes de desconectarte.</p></main><script src="app.js"></script></body></html>
